name: FreeLLM Android Release

on:
  push:
    branches:
      - production-ready-v5
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freellm-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Detect permanent signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare permanent signing key
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ai-release.jks"
          test -s "$RUNNER_TEMP/ai-release.jks"

      - name: Build unsigned release APK
        if: ${{ steps.signing.outputs.configured != 'true' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify unsigned release APK
        if: ${{ steps.signing.outputs.configured != 'true' }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F "AndroidManifest.xml" >/dev/null

      - name: Upload unsigned release APK
        if: ${{ steps.signing.outputs.configured != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Build unsigned release AAB
        if: ${{ steps.signing.outputs.configured != 'true' }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Validate unsigned release AAB
        if: ${{ steps.signing.outputs.configured != 'true' }}
        run: |
          python3 - <<'PY'
          import zipfile
          path = "app/build/outputs/bundle/release/app-release.aab"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt AAB entry: {bad}")
          PY

      - name: Upload unsigned release AAB
        if: ${{ steps.signing.outputs.configured != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ai-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null

      - name: Build signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ai-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Validate signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        run: unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Explain unsigned fallback
        if: ${{ steps.signing.outputs.configured != 'true' }}
        run: |
          echo "::warning::Permanent release signing secrets are not configured."
          echo "The CI debug APK remains available; a signed release artifact was not claimed."
