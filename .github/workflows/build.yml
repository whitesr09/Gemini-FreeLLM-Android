name: FreeLLM Android CI

on:
  push:
    branches:
      - main
      - advanced-v2-safe
      - production-ready-v5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freellm-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null

      - name: Release AAB
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Validate release AAB
        run: unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab

  instrumentation:
    if: ${{ false }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle for instrumentation
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose UI smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect -no-journal
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
