name: FreeLLM Android CI

on:
  push:
    branches: [main, advanced-v2-safe, production-ready-v5]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/freellm-release.jks
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || { echo "::error::ANDROID_SIGNING_KEYSTORE_B64 is not configured"; exit 1; }
          test -n "$ANDROID_SIGNING_STORE_PASSWORD" || { echo "::error::ANDROID_SIGNING_STORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_ALIAS" || { echo "::error::ANDROID_SIGNING_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_SIGNING_KEY_PASSWORD" || { echo "::error::ANDROID_SIGNING_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$ANDROID_SIGNING_KEYSTORE_PATH"
          chmod 600 "$ANDROID_SIGNING_KEYSTORE_PATH"
      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Release AAB
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Verify release signing and version
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.nshd.geminifreellm' versionCode='3' versionName='2.0'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
