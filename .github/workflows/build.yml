name: FreeLLM Android CI

on:
  push:
    branches:
      - main
      - advanced-v2-safe
      - production-ready-v5
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.nshd.geminifreellm'"

      - name: Release AAB
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
