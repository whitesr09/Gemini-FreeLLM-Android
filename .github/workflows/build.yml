name: FreeLLM Android CI

on:
  push:
    branches: [main, advanced-v2-safe]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Detect permanent release signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare permanent signing key
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ai-release.jks"
          test -s "$RUNNER_TEMP/ai-release.jks"
      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ai-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ai-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Build signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        env:
          ANDROID_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/ai-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release AAB
        if: ${{ steps.signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeLLM-AI-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
